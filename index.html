<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراقب شحن السيارة الكهربائية (BYD Destroyer 05)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
        }
        .neon-border {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
            border: 1px solid rgba(16, 185, 129, 0.4);
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* تنسيق القوائم المنسدلة لحل مشكلة اللون الأبيض */
        select option {
            background-color: #0f172a !important;
            color: #ffffff !important;
            padding: 10px;
        }
        select option:hover, select option:focus {
            background-color: #1e293b !important;
            color: #10b981 !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 md:p-6">

    <!-- Header & Country Selector -->
    <header class="max-w-4xl mx-auto w-full glass-panel rounded-2xl p-4 mb-6 neon-border flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-emerald-500/20 flex items-center justify-center text-emerald-400 text-2xl">
                <i class="fa-solid fa-bolt-lightning"></i>
            </div>
            <div>
                <h1 class="font-bold text-xl text-white tracking-wide">مراقب شحن السيارة الكهربائية</h1>
                <p class="text-xs text-emerald-400 font-medium">BYD Destroyer 05 & EV Charging Monitor</p>
            </div>
        </div>

        <!-- Country / Timezone Selection -->
        <div class="flex items-center gap-2 bg-slate-900/80 p-2 rounded-xl border border-slate-700 w-full sm:w-auto">
            <i class="fa-solid fa-globe text-emerald-400 text-lg"></i>
            <div class="flex flex-col flex-1">
                <span class="text-[10px] text-slate-400 font-bold">توقيت الدولة المختارة:</span>
                <select id="countrySelector" onchange="changeCountry()" class="bg-transparent text-white font-bold text-sm focus:outline-none cursor-pointer">
                    <option value="AUTO" selected>🌐
